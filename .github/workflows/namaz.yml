name: Namaz vakitleri

on:
  schedule:
    - cron: "40 3 * * *"    # her gun 03:40 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: namaz
  cancel-in-progress: true

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Diyanet vakitlerini cek
        run: |
          for i in 1 2 3; do python namaz_cek.py && exit 0; echo "Deneme $i basarisiz"; [ $i -lt 3 ] && sleep 30; done
          exit 1
      - name: Yayimla
        run: |
          git config user.name "delta-bot"
          git config user.email "actions@users.noreply.github.com"
          git add namaz.json
          git diff --cached --quiet || (git commit -m "Namaz vakitleri: $(date +%F)" && git push)
